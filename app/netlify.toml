# Configuración cuando se despliega la carpeta app/ directamente.
[build]
  command = "npm install --include=dev && npx vite build"
  publish = "dist"

[build.environment]
  BASE_PATH = "/"
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
