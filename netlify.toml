# Despliegue en Netlify: la app vive en app/ y se sirve desde la raíz del dominio.
[build]
  base = "app"
  command = "npm install --include=dev && npx vite build"
  publish = "dist"

[build.environment]
  BASE_PATH = "/"
  NODE_VERSION = "20"

# Cualquier ruta carga la app (navegación por pestañas en el cliente).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
